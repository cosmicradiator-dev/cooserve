name: E2E Tests

on:
  deployment_status:

jobs:
  e2e:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: local-services-marketplace/package-lock.json

      - name: Install dependencies
        working-directory: local-services-marketplace
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: local-services-marketplace
        run: npx playwright install --with-deps

      - name: Run Playwright tests against Preview URL
        working-directory: local-services-marketplace
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: local-services-marketplace/playwright-report/
          retention-days: 7

